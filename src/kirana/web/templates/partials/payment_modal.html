<div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200">
    <div class="flex items-center justify-between pb-4 border-b border-slate-100">
      <h3 class="text-base font-bold text-slate-900 flex items-center gap-2">
        <i data-lucide="wallet" class="w-5 h-5 text-emerald-600"></i>
        <span>Record Payment: {{ customer_name }}</span>
      </h3>
      <button onclick="document.getElementById('modal-container').innerHTML=''" class="text-slate-400 hover:text-slate-700">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
    </div>

    <form
      hx-post="/khata/payment"
      hx-target="#debtor-list-container"
      hx-swap="outerHTML"
      hx-on::after-request="document.getElementById('modal-container').innerHTML=''"
      class="mt-4 space-y-4"
    >
      <input type="hidden" name="customer_name" value="{{ customer_name }}">

      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">
          Amount Paid (₹)
        </label>
        <input
          type="number"
          step="0.01"
          name="amount_rupees"
          required
          min="1"
          placeholder="e.g. 500.00"
          class="w-full px-3.5 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 font-mono"
        />
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Payment Note / Reference</label>
        <input
          type="text"
          name="note"
          placeholder="e.g. GPay UPI ref #829182, or Cash handed at counter"
          class="w-full px-3.5 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500"
        />
      </div>

      <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-100">
        <button
          type="button"
          onclick="document.getElementById('modal-container').innerHTML=''"
          class="px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-xl transition"
        >
          Cancel
        </button>
        <button
          type="submit"
          class="px-4 py-2 text-xs font-bold text-white bg-emerald-600 hover:bg-emerald-500 rounded-xl shadow-md shadow-emerald-600/20 transition"
        >
          Confirm Payment Received
        </button>
      </div>
    </form>
  </div>
</div>
<script>lucide.createIcons();</script>
