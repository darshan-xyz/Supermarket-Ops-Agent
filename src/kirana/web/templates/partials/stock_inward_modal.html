<div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200">
    <div class="flex items-center justify-between pb-4 border-b border-slate-100">
      <h3 class="text-base font-bold text-slate-900 flex items-center gap-2">
        <i data-lucide="package-plus" class="w-5 h-5 text-brand-600"></i>
        <span>Stock Inward: {{ product.name }}</span>
      </h3>
      <button onclick="document.getElementById('modal-container').innerHTML=''" class="text-slate-400 hover:text-slate-700">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
    </div>

    <form
      hx-post="/inventory/receive"
      hx-target="#inventory-table-container"
      hx-swap="outerHTML"
      hx-on::after-request="document.getElementById('modal-container').innerHTML=''"
      class="mt-4 space-y-4"
    >
      <input type="hidden" name="product_id" value="{{ product.id }}">

      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">
          Quantity to Inward ({{ product.unit }})
        </label>
        <input
          type="number"
          step="any"
          name="qty"
          required
          min="0.001"
          placeholder="e.g. 10 or 25.5"
          class="w-full px-3.5 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500"
        />
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">New Cost Price (₹)</label>
          <input
            type="number"
            step="0.01"
            name="cost_rupees"
            placeholder="{{ "%.2f"|format(product.cost_paise / 100) }}"
            class="w-full px-3.5 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500"
          />
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">New Sell Price (₹)</label>
          <input
            type="number"
            step="0.01"
            name="sell_rupees"
            placeholder="{{ "%.2f"|format(product.sell_paise / 100) }}"
            class="w-full px-3.5 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500"
          />
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Batch Expiry Date (Optional / FEFO)</label>
        <input
          type="date"
          name="expiry"
          class="w-full px-3.5 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500"
        />
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Supplier / Inward Note</label>
        <input
          type="text"
          name="note"
          placeholder="e.g. Metro Cash & Carry Invoice #982"
          class="w-full px-3.5 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500"
        />
      </div>

      <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-100">
        <button
          type="button"
          onclick="document.getElementById('modal-container').innerHTML=''"
          class="px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-xl transition"
        >
          Cancel
        </button>
        <button
          type="submit"
          class="px-4 py-2 text-xs font-bold text-white bg-brand-600 hover:bg-brand-500 rounded-xl shadow-md shadow-brand-600/20 transition"
        >
          Confirm Restock
        </button>
      </div>
    </form>
  </div>
</div>
<script>lucide.createIcons();</script>
